<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple student to-do list to organize assignments, exams, and study tasks.">
  <title>Student To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">STUDENT PLANNER</p>
      <h1>My To-Do List</h1>
      <p>Plan your study time, one task at a time.</p>
    </header>

    <section class="panel" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a task</h2>
      <form id="task-form">
        <label for="task-input">Task name</label>
        <input id="task-input" name="task" type="text" maxlength="120" placeholder="e.g. Finish maths homework" required>
        <div class="fields">
          <div>
            <label for="subject-input">Subject</label>
            <input id="subject-input" name="subject" type="text" maxlength="40" placeholder="e.g. Mathematics">
          </div>
          <div>
            <label for="due-input">Due date</label>
            <input id="due-input" name="dueDate" type="date">
          </div>
        </div>
        <button type="submit" class="primary">+ Add task</button>
      </form>
    </section>

    <section class="task-section" aria-labelledby="tasks-heading">
      <div class="task-heading">
        <h2 id="tasks-heading">Your tasks</h2>
        <span id="task-count" class="count">0 tasks</span>
      </div>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" class="filter active" data-filter="all">All</button>
        <button type="button" class="filter" data-filter="active">To do</button>
        <button type="button" class="filter" data-filter="completed">Completed</button>
      </div>
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty">No tasks yet. Add your first study task above!</p>
      <button id="clear-completed" type="button" class="clear-button">Clear completed tasks</button>
    </section>
    <footer>Made for students · Your tasks stay saved in this browser.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
